<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e293b">

    <title>진성디지털 - 여수 학교 실시간 A/S 관리</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
        }

        header {
            background-color: #1e293b;
            color: #ffffff;
            padding: 20px 20px 16px;
            text-align: center;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
        }

        header h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        header p { font-size: 12px; color: #94a3b8; }

        .user-bar {
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 6px 5px 12px;
            border-radius: 16px;
            font-size: 12px;
            color: #e2e8f0;
        }

        .user-bar button {
            background: #475569;
            color: #ffffff;
            border: none;
            padding: 3px 9px;
            font-size: 11px;
            border-radius: 10px;
            cursor: pointer;
        }

        .main-content { padding: 20px; flex: 1; }

        .search-box { position: relative; margin-bottom: 8px; }

        .search-box input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #f8fafc;
        }

        .search-box input:focus {
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search-tip { font-size: 11px; color: #64748b; text-align: right; margin-bottom: 16px; }

        .result-card {
            display: none;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #e2e8f0;
            background-color: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            animation: slideUp 0.25s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-result { text-align: center; padding-bottom: 12px; }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 20px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .badge-jinsung { background-color: #2563eb; }
        .badge-office { background-color: #059669; }

        .school-title { font-size: 20px; font-weight: 700; color: #0f172a; }

        .as-section {
            display: none;
            margin-top: 12px;
            border-top: 1px dashed #cbd5e1;
            padding-top: 14px;
        }

        .as-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .as-header h3 { font-size: 14px; color: #334155; }

        .btn-add {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }

        /* A/S 이력 내 검색 */
        .as-search {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            background-color: #f8fafc;
            margin-bottom: 8px;
        }
        .as-search:focus { border-color: #2563eb; background-color: #fff; }

        /* 상태 필터 */
        .filter-row {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .chip {
            flex: 1;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #475569;
            padding: 7px 4px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }
        .chip.active { background: #1e293b; color: #ffffff; border-color: #1e293b; }
        .chip.active.chip-pending { background: #dc2626; border-color: #dc2626; }
        .chip.active.chip-done { background: #16a34a; border-color: #16a34a; }

        .as-count { font-size: 11px; color: #64748b; margin-bottom: 8px; }

        .as-list { display: flex; flex-direction: column; gap: 10px; }

        .as-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-left: 5px solid #94a3b8;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
        }
        .as-item.done { border-left-color: #16a34a; }
        .as-item.pending { border-left-color: #dc2626; background: #fef2f2; }

        .as-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            gap: 8px;
        }

        .as-date { font-weight: 700; color: #2563eb; }
        .as-engineer { color: #64748b; font-size: 11px; }

        .as-room {
            display: inline-flex;
            align-items: stretch;
            border: 1px solid #c7d2fe;
            border-radius: 6px;
            overflow: hidden;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .as-room-label {
            background: #e0e7ff;
            color: #4338ca;
            font-weight: 600;
            padding: 2px 7px;
        }

        .as-room-name {
            background: #ffffff;
            color: #1e293b;
            font-weight: 700;
            padding: 2px 9px;
        }

        .as-content { color: #334155; line-height: 1.4; word-break: break-all; white-space: pre-wrap; }

        .status-tag {
            border: none;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 12px;
            color: #ffffff;
            cursor: pointer;
        }
        .status-tag.done { background: #16a34a; }
        .status-tag.pending { background: #dc2626; }

        .btn-group { display: flex; gap: 4px; margin-top: 8px; }

        .btn-edit {
            background-color: #f59e0b;
            color: #ffffff;
            border: none;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-delete {
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
        }

        .empty-msg { color: #94a3b8; text-align: center; padding: 12px; font-size: 12px; }

        /* 페이지 이동 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .page-btn {
            min-width: 32px;
            height: 32px;
            padding: 0 8px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }
        .page-btn.active { background: #2563eb; border-color: #2563eb; color: #ffffff; }
        .page-btn:disabled { opacity: 0.4; cursor: default; }

        .no-result { display: none; text-align: center; color: #ef4444; font-size: 13px; padding: 20px; }

        .quiet-link {
            display: inline-block;
            margin-top: 10px;
            font-size: 12px;
            color: #94a3b8;
            text-decoration: underline;
            cursor: pointer;
        }

        .footer-note { text-align: center; margin-top: 24px; }
        .footer-note a { font-size: 11px; color: #cbd5e1; cursor: pointer; }

        .suggest-list { display: none; margin-bottom: 12px; }

        .suggest-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 6px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
            cursor: pointer;
            text-align: left;
        }

        .suggest-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 10px;
            color: #ffffff;
        }
        .suggest-tag.office { background: #059669; }
        .suggest-tag.jinsung { background: #2563eb; }

        .suggest-more { font-size: 11px; color: #94a3b8; text-align: center; padding: 4px; }

        .manage-note { font-size: 11px; color: #64748b; margin-bottom: 10px; }
        .manage-list { max-height: 40vh; overflow-y: auto; }

        .school-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 13px;
        }
        .school-row .btn-delete, .school-row .btn-edit { padding: 4px 10px; }
        .school-info { min-width: 0; }
        .school-row-name { font-weight: 600; color: #1e293b; }
        .school-row-short { font-size: 11px; color: #64748b; margin-top: 2px; }
        .row-btns { display: flex; gap: 4px; flex-shrink: 0; }

        /* 메인 화면 미처리 요약 버튼 */
        .pending-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 14px;
            border: 1px solid #fecaca;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 14px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
        }
        .pending-bar .pending-right { display: flex; align-items: center; gap: 8px; }
        .pending-count {
            background: #dc2626;
            color: #ffffff;
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 13px;
        }
        .pending-bar.zero { border-color: #bbf7d0; background: #f0fdf4; color: #15803d; }
        .pending-bar.zero .pending-count { background: #16a34a; }

        .pending-school {
            font-size: 12px;
            font-weight: 700;
            color: #0f172a;
        }
        .btn-done {
            background-color: #16a34a;
            color: #ffffff;
            border: none;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-go {
            background-color: #475569;
            color: #ffffff;
            border: none;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(2px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .modal-content h3 { margin-bottom: 12px; font-size: 16px; color: #0f172a; }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 11px; color: #64748b; margin-bottom: 4px; }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            background-color: #f8fafc;
        }

        .status-radio { display: flex; gap: 8px; }
        .status-radio label {
            flex: 1;
            text-align: center;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #64748b;
            cursor: pointer;
            margin: 0;
        }
        .status-radio input { display: none; }
        .status-radio input[value="pending"]:checked + span { color: #dc2626; }
        .status-radio label:has(input[value="pending"]:checked) { border-color: #dc2626; background: #fef2f2; color: #dc2626; }
        .status-radio label:has(input[value="done"]:checked) { border-color: #16a34a; background: #f0fdf4; color: #16a34a; }

        .modal-btns { display: flex; gap: 8px; margin-top: 16px; }

        .btn-save {
            flex: 1;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-cancel {
            flex: 1;
            background-color: #94a3b8;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>진성디지털 사이트 구분</h1>
        <p>여수 지역 학교 소속 판별 및 실시간 A/S 공유</p>
        <div class="user-bar">
            <span id="userName">👤 -</span>
            <button onclick="openNameModal()">변경</button>
        </div>
    </header>

    <div class="main-content">
        <div class="search-box">
            <input type="text" id="schoolInput" placeholder="학교 이름 입력 (예: 진남중, 백초초...)" oninput="handleInput()" onkeypress="handleKeyPress(event)" autocomplete="off">
        </div>
        <div class="search-tip">↵ Enter 키를 누르면 A/S 목록이 출력됩니다.</div>

        <button id="pendingBar" class="pending-bar zero" onclick="openPendingModal()">
            <span>미처리 A/S 전체 보기</span>
            <span class="pending-right"><span id="pendingTotal" class="pending-count">-</span><span>›</span></span>
        </button>

        <div id="resultCard" class="result-card">
            <div class="header-result">
                <span id="typeBadge" class="badge"></span>
                <div id="schoolName" class="school-title">-</div>
            </div>

            <div id="asSection" class="as-section">
                <div class="as-header">
                    <h3>🛠 실시간 A/S 조치 이력</h3>
                    <button class="btn-add" onclick="openAddModal()">+ 추가</button>
                </div>

                <input type="text" id="asSearch" class="as-search" placeholder="🔍 실, 내용, 기사명, 날짜 검색" oninput="onAsSearch()" autocomplete="off">

                <div class="filter-row">
                    <button class="chip active" data-filter="all" onclick="setFilter('all')">전체</button>
                    <button class="chip chip-pending" data-filter="pending" onclick="setFilter('pending')">미처리</button>
                    <button class="chip chip-done" data-filter="done" onclick="setFilter('done')">처리완료</button>
                </div>

                <div id="asCount" class="as-count"></div>
                <div id="asList" class="as-list"></div>
                <div id="pagination" class="pagination"></div>
            </div>
        </div>

        <div id="suggestList" class="suggest-list"></div>

        <div id="noResult" class="no-result">
            검색 결과가 없습니다. 학교명을 확인해 주세요.
            <div><a id="addSchoolLink" class="quiet-link" onclick="openSchoolModal(true)">진성 사이트로 등록</a></div>
        </div>

        <div class="footer-note"><a onclick="openManageModal()">사이트 목록 관리</a></div>
    </div>
</div>

<div id="pendingModal" class="modal">
    <div class="modal-content" style="max-width:440px;">
        <h3>미처리 A/S 전체</h3>
        <input type="text" id="pendingSearch" class="as-search" placeholder="학교, 장소, 내용, 이름 검색" oninput="onPendingSearch()" autocomplete="off">
        <div id="pendingCount" class="as-count"></div>
        <div id="pendingList" class="as-list"></div>
        <div id="pendingPagination" class="pagination"></div>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closePendingModal()">닫기</button>
        </div>
    </div>
</div>

<div id="schoolModal" class="modal">
    <div class="modal-content">
        <h3>진성 사이트 학교 추가</h3>
        <div class="form-group">
            <label>학교 정식 명칭</label>
            <input type="text" id="schoolFullName" maxlength="30">
        </div>
        <div class="form-group">
            <label>줄임말 (선택 · 비우면 자동 생성)</label>
            <input type="text" id="schoolShortName" maxlength="20">
        </div>
        <div class="modal-btns">
            <button class="btn-save" onclick="saveSchool()">추가</button>
            <button class="btn-cancel" onclick="closeSchoolModal()">취소</button>
        </div>
    </div>
</div>

<div id="manageModal" class="modal">
    <div class="modal-content">
        <h3>진성 사이트 목록 관리</h3>
        <input type="text" id="manageSearch" class="as-search" placeholder="학교 검색" oninput="renderManageList()" autocomplete="off">
        <div class="manage-note">줄임말을 수정할 수 있고, 직접 추가한 학교는 삭제도 가능합니다.</div>
        <div id="manageList" class="manage-list"></div>
        <div class="modal-btns">
            <button class="btn-save" onclick="closeManageModal(); openSchoolModal(false);">+ 학교 추가</button>
            <button class="btn-cancel" onclick="closeManageModal()">닫기</button>
        </div>
    </div>
</div>

<div id="shortModal" class="modal">
    <div class="modal-content">
        <h3>줄임말 수정</h3>
        <div id="shortModalName" style="font-size:14px; font-weight:700; margin-bottom:10px;"></div>
        <div class="form-group">
            <label>줄임말 (검색창에 이렇게 입력하면 이 학교가 나옵니다)</label>
            <input type="text" id="shortModalInput" maxlength="20" onkeypress="if(event.key==='Enter') saveShortName()">
        </div>
        <div id="shortModalDefault" class="manage-note"></div>
        <div class="modal-btns">
            <button class="btn-save" onclick="saveShortName()">저장</button>
            <button class="btn-cancel" onclick="closeShortModal()">취소</button>
        </div>
    </div>
</div>

<div id="nameModal" class="modal">
    <div class="modal-content">
        <h3>작성자 정보 입력</h3>
        <div class="form-group">
            <label>직급 / 이름 (한 번만 입력하면 이 기기에 저장됩니다)</label>
            <input type="text" id="nameInput" maxlength="20" onkeypress="if(event.key==='Enter') saveMyName()">
        </div>
        <div class="modal-btns">
            <button class="btn-save" onclick="saveMyName()">저장</button>
            <button class="btn-cancel" id="nameCancelBtn" onclick="closeNameModal()">취소</button>
        </div>
    </div>
</div>

<div id="asModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">A/S 이력 등록</h3>
        <input type="hidden" id="editKey" value="">
        <div class="form-group">
            <label>점검 일자</label>
            <input type="date" id="modalDate">
        </div>
        <div class="form-group">
            <label>장소</label>
            <input type="text" id="modalRoom">
        </div>
        <div class="form-group">
            <label>접수 내용</label>
            <textarea id="modalContent" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label>처리 상태</label>
            <div class="status-radio">
                <label><input type="radio" name="modalStatus" value="pending"><span>🔴 미처리</span></label>
                <label><input type="radio" name="modalStatus" value="done" checked><span>🟢 처리완료</span></label>
            </div>
        </div>
        <div class="modal-btns">
            <button class="btn-save" onclick="saveAsItem()">저장</button>
            <button class="btn-cancel" onclick="closeModal()">취소</button>
        </div>
    </div>
</div>

<script>

        apiKey: "AIzaSyBKzQRpRJbybbxV2Z1E5pfQyJRAYoLLlRI",

        messagingSenderId: "704344969737",
        appId: "1:704344969737:web:e731b398475a0cf9a4ded8",
        measurementId: "G-DPTE497N8H"

        { fullName: "송현초등학교", shortName: "송현초" },

        { fullName: "여남고등학교", shortName: "여남고" },

        { fullName: "경호초등학교", shortName: "경호초" },
        { fullName: "돌산초등학교 두라분교장", shortName: "두라분교" },
        { fullName: "여수여자고등학교", shortName: "여수여고" }
    ];

    const PAGE_SIZE = 5;          // 한 페이지에 보여줄 A/S 개수
    // ===== 진성디지털 직속 사이트 (기본 목록) =====
    // 여기에 없는 학교는 사이트 안에서 직접 추가할 수 있고, 추가한 학교는 Firebase에 저장되어 모두에게 공유됩니다.
    const jinsungBaseList = [
        "석유화학고등학교", "여명학교", "여문초등학교", "삼일중학교", "안산중학교",
        "한영고등학교", "웅천초등학교", "부영여자고등학교", "여수중학교", "송현유치원",
        "여천중학교", "충덕중학교", "아리울중학교", "구봉초등학교", "상암초등학교",
        "여수고등학교", "충무고등학교", "여천고등학교", "한려초등학교", "동초등학교",
        "성산유치원"
    ].map(name => ({ fullName: name, shortName: deriveShort(name) }));

    let customSchools = [];   // 사이트에서 직접 추가한 학교 (Firebase: jinsung_schools)
    let lastCandidates = [];

    function compact(s) { return String(s == null ? "" : s).replace(/\s+/g, ""); }

    // 초등학교→초, 중학교→중, 고등학교→고, 여자고등학교→여고
    function deriveShort(full) {
        return compact(full)
            .replace("여자고등학교", "여고")
            .replace("초등학교", "초")
            .replace("중학교", "중")
            .replace("고등학교", "고");
    }

    // 줄임말을 직접 수정한 학교: { 학교경로키: 줄임말 } (Firebase: school_short_overrides)
    let shortOverrides = {};

    function allSchools() {
        const base = officeSchoolList.map(s => ({ fullName: s.fullName, defaultShort: s.shortName, type: 'office' }))
            .concat(jinsungBaseList.map(s => ({ fullName: s.fullName, defaultShort: s.shortName, type: 'jinsung' })))
            .concat(customSchools.map(s => ({ fullName: s.fullName, defaultShort: s.shortName, type: 'jinsung', custom: true, key: s.key })));
        return base.map(s => Object.assign({}, s, {
            shortName: shortOverrides[sanitizePath(s.fullName)] || s.defaultShort
        }));
    }

    // 입력값과 일치하는 학교 찾기 (정확히 일치하는 학교가 있으면 그것만 반환)
    function findCandidates(query) {
        const n = compact(query);
        if (!n) return [];
        const all = allSchools();
        const exact = all.filter(s => compact(s.fullName) === n || s.shortName === n);
        if (exact.length) return exact;
        if (n.length < 2) return [];   // 한 글자만으로는 검색하지 않음
        return all.filter(s =>
            compact(s.fullName).includes(n) ||
            s.shortName.includes(n) ||
            n.includes(s.shortName)
        );
    }

    let currentSchool = null;
    let allItems = [];            // 현재 학교의 전체 A/S 이력
    let filterStatus = 'all';     // all | pending | done
    let searchText = '';
    let currentPage = 1;

    function handleInput() {
        const query = document.getElementById('schoolInput').value.trim();
        const resultCard = document.getElementById('resultCard');
        const noResult = document.getElementById('noResult');
        const asSection = document.getElementById('asSection');

        asSection.style.display = "none";
        if (currentSchool) {
            database.ref('as_history/' + sanitizePath(currentSchool)).off();
        }
        resetListState();
        hideSuggestions();
        // 미처리 전체 보기 버튼은 메인 화면(검색창이 비어 있을 때)에서만 표시
        document.getElementById('pendingBar').style.display = query === "" ? "flex" : "none";

        if (query === "") {
            resultCard.style.display = "none";
            noResult.style.display = "none";
            currentSchool = null;
            return;
        }

        const cands = findCandidates(query);
        currentSchool = null;
        resultCard.style.display = "none";
        noResult.style.display = "none";

        if (cands.length === 0) {
            // 입력 중에는 아무것도 표시하지 않음 (엔터를 눌렀을 때만 "검색 결과 없음" 표시)
            return;
        }
        if (cands.length === 1) {
            selectSchool(cands[0], false);
            return;
        }
        renderSuggestions(cands);
    }

    function selectSchool(s, autoLoad) {
        hideSuggestions();
        currentSchool = s.fullName;
        if (s.type === 'office') {
            showResult(s.fullName, "교육청 관리 사이트", "badge-office");
        } else {
            showResult(s.fullName, "진성디지털 직속 사이트", "badge-jinsung");
        }
        if (autoLoad) {
            loadAndListenAsList();
            document.getElementById('asSection').style.display = "block";
        }
    }

    // 비슷한 이름이 여러 개일 때 고르는 목록 (예: "구봉" → 구봉중학교 / 구봉초등학교)
    function renderSuggestions(cands) {
        lastCandidates = cands.slice(0, 8);
        const el = document.getElementById('suggestList');
        el.innerHTML = lastCandidates.map((s, i) => `
            <button class="suggest-item" data-idx="${i}">
                <span>${esc(s.fullName)}</span>
                <span class="suggest-tag ${s.type}">${s.type === 'office' ? '교육청' : '진성'}</span>
            </button>
        `).join("") + (cands.length > 8 ? `<div class="suggest-more">외 ${cands.length - 8}곳 · 이름을 더 입력해 주세요</div>` : "");
        el.style.display = "block";
    }

    function hideSuggestions() {
        const el = document.getElementById('suggestList');
        el.style.display = "none";
        el.innerHTML = "";
        lastCandidates = [];
    }

    document.getElementById('suggestList').addEventListener('click', (e) => {
        const btn = e.target.closest('.suggest-item');
        if (!btn) return;
        const s = lastCandidates[parseInt(btn.dataset.idx, 10)];
        if (!s) return;
        document.getElementById('schoolInput').value = s.fullName;
        selectSchool(s, true);
    });

    // ===== 사이트 직접 추가 / 관리 =====
    database.ref('jinsung_schools').on('value', (snapshot) => {
        const data = snapshot.val() || {};
        customSchools = Object.keys(data).map((k) => {
            const v = data[k] || {};
            return { key: k, fullName: v.fullName || "", shortName: v.shortName || deriveShort(v.fullName || "") };
        }).filter(s => s.fullName);
        renderManageList();
        // 목록이 바뀌었을 때, 아직 학교가 선택 전이면 입력값으로 다시 찾기
        if (!currentSchool && document.getElementById('schoolInput').value.trim()) handleInput();
    }, (error) => {
        console.error("사이트 목록 로드 오류:", error);
    });

    database.ref('school_short_overrides').on('value', (snapshot) => {
        shortOverrides = snapshot.val() || {};
        renderManageList();
        if (!currentSchool && document.getElementById('schoolInput').value.trim()) handleInput();
    }, (error) => {
        console.error("줄임말 로드 오류:", error);

    // ===== 줄임말 수정 =====
    let editingSchoolName = "";

    function openShortModal(fullName) {
        const s = allSchools().find(x => x.fullName === fullName);
        if (!s) return;
        editingSchoolName = fullName;
        document.getElementById('shortModalName').innerText = fullName;
        document.getElementById('shortModalInput').value = s.shortName;
        document.getElementById('shortModalDefault').innerText = `기본값: ${s.defaultShort}`;
        document.getElementById('shortModal').style.display = "flex";
        setTimeout(() => document.getElementById('shortModalInput').focus(), 50);
    }

    function closeShortModal() {
        document.getElementById('shortModal').style.display = "none";
    }

    function saveShortName() {
        const s = allSchools().find(x => x.fullName === editingSchoolName);
        if (!s) { closeShortModal(); return; }
        const val = compact(document.getElementById('shortModalInput').value);
        const ref = database.ref('school_short_overrides/' + sanitizePath(editingSchoolName));
        // 비우거나 기본값과 같으면 수정 기록을 지워서 기본값으로 되돌림
        const job = (!val || val === s.defaultShort) ? ref.remove() : ref.set(val);
        job.then(closeShortModal).catch((error) => alert("저장 실패: " + error.message));
    }

    // ===== 미처리 A/S 전체 보기 (학교 구분 없이) =====
    const PENDING_PAGE_SIZE = 8;
    let allPending = [];
    let pendingPage = 1;

    database.ref('as_history').on('value', (snapshot) => {
        const data = snapshot.val() || {};
        const list = [];
        Object.keys(data).forEach((schoolPath) => {
            const items = data[schoolPath];
            if (!items || typeof items !== 'object') return;
            Object.keys(items).forEach((key) => {
                const v = items[key] || {};
                if (v.status !== 'pending') return;
                list.push({
                    schoolPath: schoolPath,
                    key: key,
                    date: v.date || "",
                    room: v.room || "",
                    engineer: v.engineer || "",
                    content: v.content || ""
                });
            });
        });
        list.sort((a, b) => {
            const d = b.date.localeCompare(a.date);
            return d !== 0 ? d : (a.key < b.key ? 1 : -1);
        });
        allPending = list;
        updatePendingBar();
        if (document.getElementById('pendingModal').style.display === "flex") renderPending();
    }, (error) => {
        console.error("미처리 목록 로드 오류:", error);
        document.getElementById('pendingTotal').innerText = "!";
    });

    function updatePendingBar() {
        const n = allPending.length;
        document.getElementById('pendingTotal').innerText = n + "건";
        document.getElementById('pendingBar').classList.toggle('zero', n === 0);
    }

    function schoolNameFromPath(schoolPath) {
        const s = allSchools().find(x => sanitizePath(x.fullName) === schoolPath);
        return s ? s.fullName : schoolPath;
    }

    function openPendingModal() {
        pendingPage = 1;
        document.getElementById('pendingSearch').value = "";
        renderPending();
        document.getElementById('pendingModal').style.display = "flex";
    }

    function closePendingModal() {
        document.getElementById('pendingModal').style.display = "none";
    }

    function onPendingSearch() {
        pendingPage = 1;
        renderPending();
    }

    function pagerHtml(current, total) {
        if (total <= 1) return "";
        let startPage = Math.max(1, current - 2);
        let endPage = Math.min(total, startPage + 4);
        startPage = Math.max(1, endPage - 4);
        let html = `<button class="page-btn" data-page="${current - 1}" ${current === 1 ? 'disabled' : ''}>‹</button>`;
        if (startPage > 1) {
            html += `<button class="page-btn" data-page="1">1</button>`;
            if (startPage > 2) html += `<span style="color:#94a3b8;">…</span>`;
        }
        for (let p = startPage; p <= endPage; p++) {
            html += `<button class="page-btn ${p === current ? 'active' : ''}" data-page="${p}">${p}</button>`;
        }
        if (endPage < total) {
            if (endPage < total - 1) html += `<span style="color:#94a3b8;">…</span>`;
            html += `<button class="page-btn" data-page="${total}">${total}</button>`;
        }
        html += `<button class="page-btn" data-page="${current + 1}" ${current === total ? 'disabled' : ''}>›</button>`;
        return html;
    }

    function renderPending() {
        const q = document.getElementById('pendingSearch').value.trim().toLowerCase().replace(/\s+/g, "");
        const rows = allPending.map(it => Object.assign({ schoolName: schoolNameFromPath(it.schoolPath) }, it));
        const filtered = q ? rows.filter(it =>
            (it.schoolName + it.room + it.content + it.engineer + it.date).toLowerCase().replace(/\s+/g, "").includes(q)
        ) : rows;

        const totalPages = Math.max(1, Math.ceil(filtered.length / PENDING_PAGE_SIZE));
        if (pendingPage > totalPages) pendingPage = totalPages;

        document.getElementById('pendingCount').innerText =
            `미처리 ${allPending.length}건` + (filtered.length !== allPending.length ? ` · 검색결과 ${filtered.length}건` : "");

        const listEl = document.getElementById('pendingList');
        if (filtered.length === 0) {
            listEl.innerHTML = `<div class="empty-msg">${allPending.length === 0 ? "미처리 A/S가 없습니다." : "조건에 맞는 이력이 없습니다."}</div>`;
            document.getElementById('pendingPagination').innerHTML = "";
            return;
        }

        const start = (pendingPage - 1) * PENDING_PAGE_SIZE;
        listEl.innerHTML = filtered.slice(start, start + PENDING_PAGE_SIZE).map(it => `
            <div class="as-item pending">
                <div class="as-item-header">
                    <span class="pending-school">${esc(it.schoolName)}</span>
                    <span class="as-date">${esc(it.date) || '-'}</span>
                </div>
                ${it.room ? `<div class="as-room"><span class="as-room-label">장소</span><span class="as-room-name">${esc(it.room)}</span></div>` : ''}
                <div class="as-content">${esc(it.content) || '-'}</div>
                <div class="as-engineer" style="margin-top:6px;">${esc(it.engineer) || '-'}</div>
                <div class="btn-group">
                    <button class="btn-done" data-action="done" data-sp="${esc(it.schoolPath)}" data-key="${esc(it.key)}">처리완료로 변경</button>
                    <button class="btn-go" data-action="go" data-sp="${esc(it.schoolPath)}">해당 학교 보기</button>
                </div>
            </div>
        `).join("");
        document.getElementById('pendingPagination').innerHTML = pagerHtml(pendingPage, totalPages);
    }

    document.getElementById('pendingPagination').addEventListener('click', (e) => {
        const btn = e.target.closest('.page-btn');
        if (!btn || btn.disabled) return;
        pendingPage = parseInt(btn.dataset.page, 10);
        renderPending();
        document.getElementById('pendingList').scrollIntoView({ block: 'start' });
    });

    document.getElementById('pendingList').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const sp = btn.dataset.sp;
        if (btn.dataset.action === 'done') {
            database.ref('as_history/' + sp + '/' + btn.dataset.key)
                .update({ status: 'done' })
                .catch((error) => alert("상태 변경 실패: " + error.message));
        } else if (btn.dataset.action === 'go') {
            const s = allSchools().find(x => sanitizePath(x.fullName) === sp);
            if (!s) {
                alert("학교 목록에 없는 이름입니다. 직접 검색해 주세요.");
                return;
            }
            closePendingModal();
            document.getElementById('schoolInput').value = s.fullName;
            handleInput();
            selectSchool(s, true);
        }
    });

    function openSchoolModal(prefill) {
        const typed = prefill ? document.getElementById('schoolInput').value.trim() : "";
        document.getElementById('schoolFullName').value = typed;
        document.getElementById('schoolShortName').value = "";
        document.getElementById('schoolModal').style.display = "flex";
        setTimeout(() => document.getElementById('schoolFullName').focus(), 50);
    }

    function closeSchoolModal() {
        document.getElementById('schoolModal').style.display = "none";
    }

    function saveSchool() {
        const full = compact(document.getElementById('schoolFullName').value);
        const short = compact(document.getElementById('schoolShortName').value) || deriveShort(full);

        if (full.length < 2) {
            alert("학교 정식 명칭을 입력해 주세요.");
            return;
        }
        const dup = allSchools().find(s => compact(s.fullName) === full);
        if (dup) {
            alert(`이미 등록된 학교입니다. (${dup.type === 'office' ? '교육청' : '진성디지털'} 사이트: ${dup.fullName})`);
            return;
        }

        database.ref('jinsung_schools').push({ fullName: full, shortName: short })
            .then(() => {
                closeSchoolModal();
                document.getElementById('schoolInput').value = full;
                handleInput();
            })
            .catch((error) => alert("저장 실패: " + error.message));
    }

    function openManageModal() {
        renderManageList();
        document.getElementById('manageModal').style.display = "flex";
    }

    function closeManageModal() {
        document.getElementById('manageModal').style.display = "none";
    }

    function renderManageList() {
        const el = document.getElementById('manageList');
        if (!el) return;
        const q = compact(document.getElementById('manageSearch').value);
        let list = allSchools();
        if (q) list = list.filter(s => compact(s.fullName).includes(q) || s.shortName.includes(q));
        // 진성 사이트 먼저, 그 다음 교육청 사이트 (각각 가나다순)
        list.sort((a, b) => {
            if (a.type !== b.type) return a.type === 'jinsung' ? -1 : 1;
            return a.fullName.localeCompare(b.fullName, 'ko');
        });
        if (list.length === 0) {
            el.innerHTML = `<div class="empty-msg">검색된 학교가 없습니다.</div>`;
            return;
        }
        el.innerHTML = list.map(s => `
            <div class="school-row">
                <div class="school-info">
                    <div class="school-row-name">${esc(s.fullName)} <span class="suggest-tag ${s.type}">${s.type === 'office' ? '교육청' : '진성'}</span></div>
                    <div class="school-row-short">줄임말: ${esc(s.shortName)}</div>
                </div>
                <div class="row-btns">
                    <button class="btn-edit" data-act="short" data-name="${esc(s.fullName)}">수정</button>
                    ${s.custom ? `<button class="btn-delete" data-act="del" data-key="${esc(s.key)}">삭제</button>` : ''}
                </div>
            </div>
        `).join("");
    }

    document.getElementById('manageList').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-act]');
        if (!btn) return;
        if (btn.dataset.act === 'short') {
            openShortModal(btn.dataset.name);
            return;
        }
        const s = customSchools.find(x => x.key === btn.dataset.key);
        if (!s) return;
        if (confirm(`'${s.fullName}'을(를) 진성 사이트 목록에서 삭제하시겠습니까?\n(A/S 이력은 삭제되지 않습니다)`)) {
            database.ref('jinsung_schools/' + s.key).remove()
                .catch((error) => alert("삭제 실패: " + error.message));
        }
    });

    function resetListState() {
        allItems = [];
        filterStatus = 'all';
        searchText = '';
        currentPage = 1;
        document.getElementById('asSearch').value = '';
        updateChips();
    }

    function sanitizePath(str) {
        return str.replace(/[.#$\[\]/]/g, "_").replace(/\s+/g, "");
    }

    function showResult(title, badgeText, badgeClass) {
        document.getElementById('schoolName').innerText = title;
        const badge = document.getElementById('typeBadge');
        badge.innerText = badgeText;
        badge.className = "badge " + badgeClass;
        document.getElementById('resultCard').style.display = "block";
        document.getElementById('noResult').style.display = "none";
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            if (currentSchool) {
                loadAndListenAsList();
                document.getElementById('asSection').style.display = "block";
            } else {
                const query = document.getElementById('schoolInput').value.trim();
                if (query && findCandidates(query).length === 0) {
                    document.getElementById('noResult').style.display = "block";
                    document.getElementById('addSchoolLink').style.display = compact(query).length >= 2 ? "inline" : "none";
                }
            }
        }
    }

    function esc(str) {
        return String(str == null ? "" : str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    // Firebase 실시간 구독 → allItems 갱신 → 화면 그리기
    function loadAndListenAsList() {
        const safePath = sanitizePath(currentSchool);
        const ref = database.ref('as_history/' + safePath);

        ref.off();
        ref.on('value', (snapshot) => {
            const data = snapshot.val() || {};
            allItems = Object.keys(data).map((key) => {
                const v = data[key] || {};
                return {
                    key: key,
                    date: v.date || "",
                    room: v.room || "",
                    engineer: v.engineer || "",
                    content: v.content || "",
                    // 예전에 저장된 데이터(상태 없음)는 처리완료로 간주
                    status: v.status === "pending" ? "pending" : "done"
                };
            });

            // 최신순 정렬 (날짜 내림차순, 같은 날짜면 등록 순서 내림차순)
            allItems.sort((a, b) => {
                const d = b.date.localeCompare(a.date);
                return d !== 0 ? d : (a.key < b.key ? 1 : -1);
            });

            render();
        }, (error) => {
            console.error("데이터 로드 오류:", error);
        });
    }

    function getFilteredItems() {
        const q = searchText.trim().toLowerCase();
        return allItems.filter((item) => {
            if (filterStatus !== 'all' && item.status !== filterStatus) return false;
            if (!q) return true;
            return (item.room + " " + item.content + " " + item.engineer + " " + item.date)
                .toLowerCase().includes(q);
        });
    }

    function render() {
        const container = document.getElementById('asList');
        const countEl = document.getElementById('asCount');
        const filtered = getFilteredItems();

        const pendingCount = allItems.filter(i => i.status === 'pending').length;
        const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;

        countEl.innerText = `전체 ${allItems.length}건 · 미처리 ${pendingCount}건` +
            (filtered.length !== allItems.length ? ` · 검색결과 ${filtered.length}건` : "");

        if (filtered.length === 0) {
            container.innerHTML = `<div class="empty-msg">${allItems.length === 0 ? "등록된 A/S 이력이 없습니다." : "조건에 맞는 이력이 없습니다."}</div>`;
            document.getElementById('pagination').innerHTML = "";
            return;
        }

        const start = (currentPage - 1) * PAGE_SIZE;
        const pageItems = filtered.slice(start, start + PAGE_SIZE);

        container.innerHTML = pageItems.map((item) => {
            const isDone = item.status === 'done';
            return `
                <div class="as-item ${isDone ? 'done' : 'pending'}">
                    <div class="as-item-header">
                        <span class="as-date">${esc(item.date) || '-'}</span>
                        <button class="status-tag ${isDone ? 'done' : 'pending'}" data-action="toggle" data-key="${esc(item.key)}" title="누르면 상태가 바뀝니다">
                            ${isDone ? '🟢 처리완료' : '🔴 미처리'}
                        </button>
                    </div>
                    ${item.room ? `<div class="as-room"><span class="as-room-label">장소</span><span class="as-room-name">${esc(item.room)}</span></div>` : ''}
                    <div class="as-content">${esc(item.content) || '-'}</div>
                    <div class="as-engineer" style="margin-top:6px;">${esc(item.engineer) || '-'}</div>
                    <div class="btn-group">
                        <button class="btn-edit" data-action="edit" data-key="${esc(item.key)}">수정</button>
                        <button class="btn-delete" data-action="delete" data-key="${esc(item.key)}">삭제</button>
                    </div>
                </div>
            `;
        }).join("");

        renderPagination(totalPages);
    }

    // 1 2 3 4 5 형태의 페이지 버튼 (현재 페이지 기준 최대 5개 표시)
    function renderPagination(totalPages) {
        const el = document.getElementById('pagination');
        if (totalPages <= 1) {
            el.innerHTML = "";
            return;
        }

        let startPage = Math.max(1, currentPage - 2);
        let endPage = Math.min(totalPages, startPage + 4);
        startPage = Math.max(1, endPage - 4);

        let html = `<button class="page-btn" data-page="${currentPage - 1}" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;
        if (startPage > 1) {
            html += `<button class="page-btn" data-page="1">1</button>`;
            if (startPage > 2) html += `<span style="color:#94a3b8;">…</span>`;
        }
        for (let p = startPage; p <= endPage; p++) {
            html += `<button class="page-btn ${p === currentPage ? 'active' : ''}" data-page="${p}">${p}</button>`;
        }
        if (endPage < totalPages) {
            if (endPage < totalPages - 1) html += `<span style="color:#94a3b8;">…</span>`;
            html += `<button class="page-btn" data-page="${totalPages}">${totalPages}</button>`;
        }
        html += `<button class="page-btn" data-page="${currentPage + 1}" ${currentPage === totalPages ? 'disabled' : ''}>›</button>`;
        el.innerHTML = html;
    }

    document.getElementById('pagination').addEventListener('click', (e) => {
        const btn = e.target.closest('.page-btn');
        if (!btn || btn.disabled) return;
        currentPage = parseInt(btn.dataset.page, 10);
        render();
        document.getElementById('asSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    // 수정 / 삭제 / 상태 전환 버튼 (이벤트 위임)
    document.getElementById('asList').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const key = btn.dataset.key;
        const action = btn.dataset.action;
        if (action === 'edit') openEditModal(key);
        else if (action === 'delete') deleteAsItem(key);
        else if (action === 'toggle') toggleStatus(key);
    });

    function onAsSearch() {
        searchText = document.getElementById('asSearch').value;
        currentPage = 1;
        render();
    }

    function setFilter(f) {
        filterStatus = f;
        currentPage = 1;
        updateChips();
        render();
    }

    function updateChips() {
        document.querySelectorAll('.chip').forEach((c) => {
            c.classList.toggle('active', c.dataset.filter === filterStatus);
        });
    }

    function toggleStatus(key) {
        const item = allItems.find(i => i.key === key);
        if (!item) return;
        const next = item.status === 'done' ? 'pending' : 'done';
        database.ref('as_history/' + sanitizePath(currentSchool) + '/' + key)
            .update({ status: next })
            .catch((error) => alert("상태 변경 실패: " + error.message));
    }

    function deleteAsItem(key) {
        if (confirm("해당 A/S 이력을 삭제하시겠습니까?")) {
            database.ref('as_history/' + sanitizePath(currentSchool) + '/' + key).remove()
                .catch((error) => {
                    alert("삭제 실패: " + error.message);
                });
        }
    }

    function setModalStatus(status) {
        document.querySelectorAll('input[name="modalStatus"]').forEach((r) => {
            r.checked = (r.value === status);
        });
    }

    function openAddModal() {
        document.getElementById('modalTitle').innerText = `${currentSchool} A/S 추가`;
        document.getElementById('editKey').value = "";
        document.getElementById('modalDate').value = new Date().toISOString().substring(0, 10);
        document.getElementById('modalRoom').value = "";
        document.getElementById('modalContent').value = "";
        setModalStatus('done');
        document.getElementById('asModal').style.display = "flex";
    }

    function openEditModal(key) {
        const item = allItems.find(i => i.key === key);
        if (!item) return;
        document.getElementById('modalTitle').innerText = `${currentSchool} A/S 수정`;
        document.getElementById('editKey').value = key;
        document.getElementById('modalDate').value = item.date;
        document.getElementById('modalRoom').value = item.room;
        document.getElementById('modalContent').value = item.content;
        setModalStatus(item.status);
        document.getElementById('asModal').style.display = "flex";
    }

    function closeModal() {
        document.getElementById('asModal').style.display = "none";
    }

    // ===== 작성자(담당 기사) 이름: 이 기기에 저장 =====
    const NAME_KEY = 'as_engineer_name';
    let myNameCache = "";

    function getMyName() {
        try {
            const saved = localStorage.getItem(NAME_KEY);
            if (saved) return saved;
        } catch (e) {}
        return myNameCache;
    }

    function updateUserBar() {
        const name = getMyName();
        document.getElementById('userName').innerText = name ? `👤 ${name}` : "👤 이름 미입력";
    }

    function openNameModal() {
        const name = getMyName();
        document.getElementById('nameInput').value = name;
        // 이름이 아직 없으면 취소 불가 (처음 접속 시 반드시 입력)
        document.getElementById('nameCancelBtn').style.display = name ? "block" : "none";
        document.getElementById('nameModal').style.display = "flex";
        setTimeout(() => document.getElementById('nameInput').focus(), 50);
    }

    function closeNameModal() {
        document.getElementById('nameModal').style.display = "none";
    }

    function saveMyName() {
        const name = document.getElementById('nameInput').value.trim();
        if (!name) {
            alert("직급/이름을 입력해 주세요.");
            return;
        }
        myNameCache = name;
        try { localStorage.setItem(NAME_KEY, name); } catch (e) {}
        updateUserBar();
        closeNameModal();
    }

    updateUserBar();
    if (!getMyName()) openNameModal();

    function saveAsItem() {
        const key = document.getElementById('editKey').value;
        const date = document.getElementById('modalDate').value;
        const room = document.getElementById('modalRoom').value.trim();
        // 담당 기사명은 저장해 둔 내 이름을 자동 입력 (수정 시에는 기존 작성자 유지)
        const existing = key ? allItems.find(i => i.key === key) : null;
        const engineer = (existing && existing.engineer) ? existing.engineer : getMyName();
        const content = document.getElementById('modalContent').value.trim();
        const statusEl = document.querySelector('input[name="modalStatus"]:checked');
        const status = statusEl ? statusEl.value : 'done';

        if (!engineer) {
            closeModal();
            openNameModal();
            return;
        }

        if (!date || !room || !content) {
            alert("모든 필드(일자, 장소, 접수 내용)를 입력해 주세요.");
            return;
        }

        const ref = database.ref('as_history/' + sanitizePath(currentSchool));
        const payload = { date, room, engineer, content, status };
        const promise = (key === "") ? ref.push(payload) : ref.child(key).update(payload);

        promise.then(() => {
            closeModal();
            // 실시간 리스너(on 'value')가 자동으로 목록을 갱신합니다.
        }).catch((error) => {
            console.error("저장 오류:", error);
            alert("저장 실패: " + error.message);
        });
    }
</script>

</body>
</html>
